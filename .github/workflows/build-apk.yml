name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html style.css engine.js engine.bundle.js sw.js manifest.json icon-512.png icon-192.png www/ || true

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -f "android/build.gradle" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Restore Custom Kotlin & Manifest files
        run: |
          mkdir -p android/app/src/main/java/com/aimsens/touchengine
          cp -f android/app/src/main/java/com/aimsens/touchengine/TouchEnginePlugin.kt android/app/src/main/java/com/aimsens/touchengine/TouchEnginePlugin.kt || true
          cp -f android/app/src/main/java/com/aimsens/touchengine/MainActivity.kt android/app/src/main/java/com/aimsens/touchengine/MainActivity.kt || true

      - name: Make Gradle executable
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimSens-TouchEngine-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
